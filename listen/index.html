      <h2>以后会放什么</h2>
      <p>听力阶段的每一课打算只有这些：</p>
      <ul>
        <li>一段很短的音频，文件放在本站</li>
        <li>同一段话的原文，听之前先收起来</li>
        <li>听完要做的一件事，例如用中文说出谁做了什么，或补出一个没听清的词</li>
      </ul>
      <p>不做成听力考试，也不要求听懂每一个词。</p>
